name: Build and Upload Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create ZIP file
        run: |
          cd custom_components/paradigma
          zip -r ../../paradigma.zip .

      - name: Upload ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          files: paradigma.zip
